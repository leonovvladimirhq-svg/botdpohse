# Конфигурация Cloudflare Worker — посредника Telegram Bot API.
# Деплой через CLI:  npx wrangler deploy
# (можно и без него — через веб-консоль, см. README.md)

name = "tg-relay-dpo"
main = "worker.js"
compatibility_date = "2026-09-01"

# Ограничения доступа. Не секреты (IP и номер бота), поэтому лежат здесь,
# а не в `wrangler secret`. Хотя бы одно поле обязано быть непустым — иначе
# Worker отвечает 503 и никого не пропускает (fail closed).
[vars]
# IP виртуальной машины с ботом. Сверяйтесь: адрес уже менялся однажды.
ALLOWED_IPS = "89.169.142.74"
# Числовая часть токена до двоеточия — чтобы релеем нельзя было пользоваться
# с чужим токеном, даже совпав по IP. Пусто = пускать любых ботов с этого IP.
ALLOWED_BOT_IDS = ""
