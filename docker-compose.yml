services:
  faqbot:
    build: .
    image: faqbot:latest
    container_name: faqbot
    restart: unless-stopped
    env_file: .env
    # Раньше здесь был пин api.telegram.org → 149.154.167.220 (в ru-central1 DNS
    # отдавал только IPv6). С сентября 2026 ТСПУ режет трафик к Telegram с любых
    # российских серверов, и пин мёртв. Фильтрация по назначению, а не по нашему IP —
    # замер на четырёх ВМ в разных подсетях дал идентичный результат, так что менять
    # адрес ВМ бесполезно. Bot API доступен только через внешнюю точку:
    # TELEGRAM_RELAY_URL в .env (см. README.md, раздел «Восстановление Telegram-версии»).
    volumes:
      # questions_log.csv переживает пересборку/рестарт контейнера
      - ./data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
